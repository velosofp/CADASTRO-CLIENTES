<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de clientes</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body class="pagina-cadastro">
    <nav class="menu-navegacao">
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="clientes.html">Clientes</a>
    </nav>

    <main class="conteudo princiapl">
        <img src="assets/logo.png" alt="Logo da republica federativa do brasil, brasão predominantemente amarela, verde, e detalhes em azul, com formato de grande estrela sendo atravessada por uma espada. Dentro dessa estrela possui um cercado de novas estrelas e 5 estrelas principais do cruzeiro do sul" class="logo">
        
        <form id="formulario-cadastro">
            <input type="text" id="nome" placeholder="Ex: Maria" required>
            <input type="email" id="email" placeholder="Ex: aluno.sobrenome@uf.estudante.senai.br" required>
            <input type="tel" id="telefone" placeholder="Ex: 71 90000-0000" required>
            <button type="button" onclick="funcaoCadastrarCliente()">Cadastrar</button>
        </form>
    </main>

    <script src="cadastro.js"></script>
</body>

</html>
